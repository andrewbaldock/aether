<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: required for env(safe-area-inset-*) to report
         nonzero values on iOS (notch / home indicator). The composer and shell
         lean on those insets — without cover they silently collapse to 0, and
         the black-translucent status-bar style below also needs it. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <title>Aether</title>
    <!-- Tab title by environment: prod shows the tagline, dev is flagged so the
         two tabs are easy to tell apart. Vite's dev server runs on localhost or
         the aether-dev host (see vite.config.ts allowedHosts). -->
    <script>
      (() => {
        const host = location.hostname;
        const isDev =
          host === "localhost" || host === "127.0.0.1" || host.endsWith("-dev");
        document.title = isDev ? "Aether-dev" : "Aether • Ask Anything";
      })();
    </script>
    <meta name="description" content="Aether — a conversational AI explorer by Andrew Baldock." />
    <link rel="canonical" href="https://aether.andrewbaldock.com" />
    <!-- PWA: vite-plugin-pwa injects <link rel="manifest"> automatically. These
         tags cover the bits it doesn't: iOS standalone behavior and the OS
         status-bar tint. theme-color matches the manifest (near-black shell). -->
    <meta name="theme-color" content="#110d1a" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- Standalone install. The unprefixed mobile-web-app-capable is the standard
         (Chrome warns if it's missing); the apple- prefixed one is still required by
         iOS Safari, so we keep BOTH rather than replacing. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Aether" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://aether.andrewbaldock.com" />
    <meta property="og:title" content="Aether" />
    <meta property="og:description" content="Aether — a conversational AI explorer by Andrew Baldock." />
    <!-- Set the theme class before first paint to avoid a flash of the wrong
         theme. Mirrors getInitialTheme() in src/theme/useTheme.tsx: stored
         choice wins, else follow the OS preference. -->
    <script>
      (() => {
        try {
          const el = document.documentElement;
          let t = localStorage.getItem("aether-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") el.classList.add("dark");

          // Seed the favicon to match the theme so the tab icon doesn't flash
          // the wrong background on load (kept in sync after mount by useTheme).
          const icon = document.createElement("link");
          icon.rel = "icon";
          icon.type = "image/svg+xml";
          icon.href = t === "dark" ? "/favicon.svg" : "/favicon-light.svg";
          document.head.appendChild(icon);

          // Typography prefs — mirrors useAppearance.tsx (TEXT_SIZE_PX/FONT_STACK).
          // Seeded pre-paint so text size and body font don't flash on load.
          const sizes = { xs: 14, sm: 15, md: 16, lg: 18 };
          const s = localStorage.getItem("aether-text-size");
          if (sizes[s]) el.style.fontSize = `${sizes[s]}px`;

          const fonts = {
            geist: '"Geist", ui-sans-serif, system-ui, sans-serif',
            georgia: 'Georgia, Cambria, "Times New Roman", Times, serif',
            lora: '"Lora", Georgia, Cambria, "Times New Roman", Times, serif',
          };
          const f = localStorage.getItem("aether-font-face");
          if (fonts[f]) el.style.setProperty("--font-body", fonts[f]);

          // Theme Lab overrides — mirrors useTokenLab.tsx. Seeded pre-paint so a
          // visitor's edited palette doesn't flash the committed defaults on load.
          // Applies the active theme's set; the intermediate custom props flip
          // every var(--color-*) that resolves through them.
          const ov = JSON.parse(
            localStorage.getItem("aether-token-overrides") || "null"
          );
          const active = ov && ov[t];
          if (active) {
            for (const name in active) {
              el.style.setProperty(`--${name}`, active[name]);
            }
          }
        } catch {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@700&family=Space+Grotesk:wght@500;600;700&family=Grenze+Gotisch:wght@500;600;700&family=Geist:wght@400;500;600&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
