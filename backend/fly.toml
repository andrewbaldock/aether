app = "aether-ab-api"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Keep one machine always warm. With min_machines_running = 0 the machine
  # scaled to zero when idle, and a chat request landing during the cold-start
  # window got a 502 straight from the Fly proxy (before the app ran) — the
  # mid-conversation 502s. One always-on shared-cpu machine closes that window.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/api/health"
    timeout = "5s"
